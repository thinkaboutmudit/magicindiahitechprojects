name: Deploy to Hostinger

on:
  push:
    branches: [ main ]

env:
  NODE_VERSION: 18

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

      - name: Sync `dist/` to Hostinger (rsync)
        run: |
          rsync -avz --delete --exclude='.git*' dist/ ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_REMOTE_PATH }}

      - name: Run remote post-deploy commands
        run: |
          HOST=${{ secrets.HOSTINGER_HOST }}
          USER=${{ secrets.HOSTINGER_USER }}
          PORT=${{ secrets.HOSTINGER_PORT }}
          REMOTE_PATH=${{ secrets.HOSTINGER_REMOTE_PATH }}
          SSH_CMD="ssh -o StrictHostKeyChecking=no"
          if [ -n "$PORT" ]; then SSH_CMD="$SSH_CMD -p $PORT"; fi
          $SSH_CMD $USER@$HOST "cd $REMOTE_PATH && npm install --production --no-audit --no-fund || true && # try restart with pm2 if available
            pm2 restart magic-india || (npm start &>/dev/null &)"
